controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_controller:
      type: joint_controller/JointController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    joint_forward_trajectory_controller:
      type: joint_forward_trajectory_controller/JointForwardTrajectoryController

    contact_sensors_broadcaster:
      type: contact_sensors_broadcaster/ContactSensorsBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"

contact_sensors_broadcaster:
  ros__parameters:
    frame_ids:
      - RFF_link
      - RRF_link
      - LFF_link
      - LRF_link
    sensor_names:
      - RFF_link_contact_sensor
      - RRF_link_contact_sensor
      - LFF_link_contact_sensor
      - LRF_link_contact_sensor
    interface_postfix: "contact"
    publish_with_change: true
    use_debouncer: true
    debouncer_threshold_seconds: 0.002

joint_forward_trajectory_controller:
  ros__parameters:
    joints:
      - joint_controller/LFT_joint
      - joint_controller/LFH_joint
      - joint_controller/LFK_joint
      - joint_controller/RFT_joint
      - joint_controller/RFH_joint
      - joint_controller/RFK_joint
      - joint_controller/LRT_joint
      - joint_controller/LRH_joint
      - joint_controller/LRK_joint
      - joint_controller/RRT_joint
      - joint_controller/RRH_joint
      - joint_controller/RRK_joint

    command_interfaces:
      - position
      - velocity
      - effort

    interpolate_from_desired_state: true

    allow_partial_joints_goal: true

